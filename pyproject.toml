[project]
name = "deeptrade-ai"
version = "0.1.0"
description = "DeepTrade AI — Personal AI-powered trading platform for NSE/BSE"
requires-python = ">=3.12"
authors = [{name = "Sagar"}]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Cache / Queue
    "redis[hiredis]>=5.2.0",

    # Broker
    "kiteconnect>=5.0.1",

    # Data + Analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=1.13.0",
    "pandas-ta>=0.3.14b0",
    "pyarrow>=18.0.0",

    # ML
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "optuna>=4.1.0",

    # HTTP / Async
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "tenacity>=9.0.0",

    # Utilities
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "click>=8.1.7",
    "pyyaml>=6.0.2",

    # Backtesting (research)
    "vectorbt>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
    "jupyterlab>=4.3.0",
]

ml-extras = [
    "transformers>=4.45.0",
    "torch>=2.5.0",  # MPS support on M-series
    "sentence-transformers>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

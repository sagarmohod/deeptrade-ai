services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: deeptrade-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deeptrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeptrade_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-deeptrade}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deeptrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deeptrade-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deeptrade-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://deeptrade:deeptrade_dev_password@postgres:5432/deeptrade
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./data:/app/data
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
